name: Tests

# Runs on every push and pull request. GitHub Pages publishes the branch regardless of the result,
# so check the green tick (or the Actions tab) before sharing a new version of the kit.
# It also runs every Monday, so the survey-sync check notices when the live survey changes.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Engine unit tests
        if: ${{ !cancelled() }}
        run: npm run test:script
      - name: Browser tests
        if: ${{ !cancelled() }}
        run: npm run test:ui

  # Fails when assets/survey.json or assets/readiness.json no longer match the live survey site,
  # which means links from the survey would be decoded wrong. Fix: copy the files across (see README).
  survey-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Copies match the live survey
        if: ${{ !cancelled() }}
        run: npm run check:sync
      # Warns two weeks before the last key date and fails once every date has passed,
      # so the Monday run emails a reminder to add next semester's dates.
      - name: Key dates are still ahead
        if: ${{ !cancelled() }}
        run: npm run check:dates
